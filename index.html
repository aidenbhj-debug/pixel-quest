<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>픽셀 퀘스트 온라인</title>
<style>
:root{
  --bg:#0f0d18; --surface:rgba(246,241,230,.96); --surface2:#e7dfcd; --ink:#24190e; --muted:#6e5d45; --line:#24190e;
  --accent:#b8352a; --accent-ink:#fff6ee; --gold:#94690a; --hp:#d23a3a; --mp:#2d63d0; --xp:#2c8f4c; --off:#c9bea6;
  --glass:rgba(20,16,30,.62); --glass-ink:#f6eedc;
  --pix:ui-monospace, "Courier New", monospace;
  --ko:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --surface:rgba(30,26,44,.97); --surface2:#2d2843; --ink:#f2ead8; --muted:#a79cbd; --line:#5f567f;
    --accent:#e8624d; --accent-ink:#1a0f0c; --gold:#f2c14e; --hp:#ff5c5c; --mp:#5e9bff; --xp:#5fd07f; --off:#3a3552; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --surface:rgba(30,26,44,.97); --surface2:#2d2843; --ink:#f2ead8; --muted:#a79cbd; --line:#5f567f;
  --accent:#e8624d; --accent-ink:#1a0f0c; --gold:#f2c14e; --hp:#ff5c5c; --mp:#5e9bff; --xp:#5fd07f; --off:#3a3552; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:var(--ko);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
.T{top:calc(env(safe-area-inset-top,0px) + 8px)} .B{bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
#hud{position:fixed;left:8px;width:min(230px,52vw);background:var(--glass);color:var(--glass-ink);padding:7px 9px;border:2px solid #000;font-size:12px;line-height:1.3;pointer-events:none}
#hud .nm{font-weight:800;display:flex;justify-content:space-between;gap:6px}
#hud .nm span:last-child{font-family:var(--pix);color:#f2c14e}
#hud .jb{opacity:.85;font-size:11px;margin-bottom:3px}
.bar{position:relative;height:9px;background:rgba(0,0,0,.5);border:1px solid #000;margin-top:3px}
.bar i{position:absolute;inset:0 auto 0 0;display:block}
.bar b{position:absolute;right:3px;top:-3px;font:400 9px var(--pix);color:#fff;text-shadow:1px 1px 0 #000}
.bh i{background:#e04646} .bm i{background:#4a86f0} .bx i{background:#4cc574}
#top{position:fixed;right:8px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;max-width:46vw}
.ib{font:inherit;font-size:17px;width:38px;height:38px;border:2px solid #000;background:var(--glass);color:var(--glass-ink);padding:0;cursor:pointer;position:relative;touch-action:manipulation}
.ib:active{transform:translateY(2px)}
.ib .cnt{position:absolute;right:-4px;top:-6px;font:700 10px var(--pix);background:#e8624d;color:#fff;border:1px solid #000;padding:0 3px}
.ib:focus-visible,.btn:focus-visible,.ab:focus-visible{outline:3px dashed #f2c14e;outline-offset:2px}
#mini{position:fixed;right:8px;top:calc(env(safe-area-inset-top,0px) + 96px);width:108px;height:86px;border:2px solid #000;background:rgba(10,8,20,.7);image-rendering:pixelated;cursor:pointer;touch-action:manipulation}
#mini[hidden]{display:none}
.wmap{overflow-x:auto;border:2px solid var(--line);background:var(--surface2);margin:6px 0 10px}
.wmap svg{display:block}
#raidbar{position:fixed;left:calc(env(safe-area-inset-left,0px) + 8px);top:calc(env(safe-area-inset-top,0px) + 118px);width:min(230px,52vw);background:rgba(40,8,12,.82);color:#fff;border:2px solid #ff5a3a;padding:6px 8px;font-size:12px;font-weight:800;display:flex;gap:6px;align-items:center;z-index:4}
#raidbar[hidden]{display:none}#raidbar span{flex:1;line-height:1.35}#raidbar .btn{padding:4px 8px;font-size:12px;box-shadow:none}
#mapname{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);font-weight:900;font-size:20px;color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;pointer-events:none;opacity:0;transition:opacity .6s;white-space:nowrap}
#chatlog{position:fixed;left:8px;width:min(300px,60vw);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);font-size:12px;line-height:1.35;color:#fff;text-shadow:1px 1px 0 #000;pointer-events:none}
#chatlog p{margin:1px 0;background:rgba(0,0,0,.35);padding:1px 5px;width:fit-content;max-width:100%;overflow-wrap:anywhere}
#chatlog .sys{color:#ffd86a} #chatlog .bot{color:#d8d0f0} #chatlog .real{color:#9ff0ff}
#joy{position:fixed;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);pointer-events:none;display:none;transform:translate(-50%,-50%)}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid #000}
#joyhint{position:fixed;left:24px;width:96px;height:96px;border-radius:50%;border:2px dashed rgba(255,255,255,.3);color:rgba(255,255,255,.55);display:grid;place-items:center;font-size:11px;text-align:center;pointer-events:none}
#acts{position:fixed;right:10px;width:200px;height:190px}
.ab{position:absolute;border:2px solid #000;background:var(--glass);color:#fff;font:800 12px var(--ko);display:grid;place-items:center;padding:0;cursor:pointer;touch-action:manipulation;overflow:hidden;border-radius:50%}
.ab:active{filter:brightness(1.4)}
.ab .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65)}
.ab .cdt{position:absolute;inset:0;display:grid;place-items:center;font:800 15px var(--ko);color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;z-index:2;pointer-events:none}
.ab.cool .em,.ab.cool .lb{opacity:.35}
.ab .lb{position:relative;line-height:1.05;text-align:center;font-size:10px;text-shadow:1px 1px 0 #000}
.ab .em{position:relative;font-size:19px;line-height:1}
.ab.atk{width:78px;height:78px;right:0;bottom:0;background:rgba(184,53,42,.85);transition:background .15s}
.ab.atk.talk{background:rgba(40,120,70,.92);box-shadow:0 0 0 3px rgba(255,216,74,.7)}
.ab.atk .em{font-size:30px}
.ab.act{width:54px;height:54px;right:88px;bottom:0;background:rgba(40,110,60,.85)}
.ab.act[hidden]{display:none}
.ab.sk{width:50px;height:50px}
.ab.pot{width:40px;height:40px;right:146px;bottom:62px}
.ab.dis{opacity:.45}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 104px);display:grid;gap:4px;justify-items:center;pointer-events:none;width:90vw}
#toast p{margin:0;background:rgba(0,0,0,.78);color:#fff;font-weight:800;font-size:13px;padding:6px 12px;border:2px solid #f2c14e;animation:tin 3.2s forwards;text-align:center}
@keyframes tin{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#prog{position:fixed;left:50%;top:58%;transform:translateX(-50%);width:120px;height:12px;border:2px solid #000;background:rgba(0,0,0,.6);display:none}
#prog i{display:block;height:100%;background:#f2c14e}
#prog span{position:absolute;top:-20px;left:0;right:0;text-align:center;color:#fff;font-weight:800;font-size:12px;text-shadow:1px 1px 0 #000}
.layer{position:fixed;inset:0;display:none;background:rgba(5,4,10,.55);z-index:20;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 10px);overflow:auto;-webkit-user-select:text;user-select:text}
.layer.on{display:block}
.sheet{max-width:560px;margin:0 auto;background:var(--surface);border:3px solid var(--line);box-shadow:0 5px 0 #000;padding:14px 14px 16px}
.sheet h2{margin:0 0 8px;font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet h3{margin:14px 0 6px;font-size:15px}
.sheet p{margin:4px 0}
.x{font:inherit;font-size:16px;font-weight:900;width:36px;height:36px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer;flex:none}
.muted{color:var(--muted);font-size:13px}
.btn{font:inherit;font-weight:800;font-size:14px;color:var(--ink);background:var(--surface2);border:2px solid var(--line);padding:9px 12px;box-shadow:0 3px 0 var(--line);cursor:pointer;touch-action:manipulation}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{background:var(--off);color:var(--muted);cursor:not-allowed}
.btn.w{width:100%}
.btn small{display:block;font-weight:600;font-size:11px;opacity:.85}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--off)}
.row:first-child{border-top:0}
.row .f{flex:1;min-width:0}
.row .f b{display:block}
.num{font-family:var(--pix);color:var(--gold)}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:7px;max-height:42vh;overflow:auto;padding:2px}
.job{font:inherit;border:2px solid var(--line);background:var(--surface2);color:var(--ink);padding:6px 4px;cursor:pointer;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:800;text-align:center}
.job canvas{width:40px;height:40px;image-rendering:pixelated}
.job.sel{background:var(--accent);color:var(--accent-ink)}
.job:disabled{opacity:.55;cursor:not-allowed}
.job small{font-weight:600;font-size:10px;opacity:.85}
input[type=text]{font:inherit;font-size:16px;font-weight:700;width:100%;padding:9px;border:2px solid var(--line);background:var(--surface2);color:var(--ink)}
.tree{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tcol{display:grid;gap:6px;align-content:start}
.tcol>b{text-align:center;font-size:12px}
.node{font:inherit;border:2px solid var(--line);background:var(--surface2);color:var(--ink);padding:6px 3px;font-size:11px;font-weight:800;cursor:pointer;text-align:center;line-height:1.25;position:relative}
.node small{display:block;font-weight:600;font-size:10px;color:var(--muted)}
.node .rk{font-family:var(--pix);font-size:11px;color:var(--gold)}
.node.max{background:#f2c14e;color:#24190e}.node.max small{color:#5a4410}
.node:disabled{opacity:.5;cursor:not-allowed}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;font-weight:800}
.chain span{border:2px solid var(--line);padding:2px 6px;background:var(--surface2)}
.chain span.cur{background:var(--accent);color:var(--accent-ink)}
.chain span.hid{border-style:dashed}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:0 5px;border:1px solid var(--line);margin-left:4px;vertical-align:middle}
#dialog{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-width:560px;margin:0 auto;z-index:15;display:none;background:var(--surface);border:3px solid var(--line);box-shadow:0 4px 0 #000;padding:12px}
#dialog.on{display:block}
#dialog .who{font-weight:900;margin-bottom:4px}
#dialog .say{font-size:14px;line-height:1.5;margin-bottom:10px}
#dialog .opts{display:flex;flex-wrap:wrap;gap:6px}
#chatbar{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:16;display:none;gap:6px;max-width:560px;margin:0 auto}
#chatbar.on{display:flex}
.logo{font-family:var(--pix);font-weight:700;font-size:30px;line-height:1;text-align:center;margin:4px 0}
.center{text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#hud{left:calc(env(safe-area-inset-left,0px) + 8px)} #top{right:calc(env(safe-area-inset-right,0px) + 8px)} #acts{right:calc(env(safe-area-inset-right,0px) + 10px)} #mini{right:calc(env(safe-area-inset-right,0px) + 8px)} #chatlog{left:calc(env(safe-area-inset-left,0px) + 8px)} #joyhint{left:calc(env(safe-area-inset-left,0px) + 24px)}
@media (orientation:landscape) and (max-height:540px){
  #hud{width:min(200px,28vw);font-size:11px;padding:5px 7px}
  #hud .jb{margin-bottom:1px}
  .bar{height:8px;margin-top:2px}
  #top{max-width:62vw;gap:4px}
  .ib{width:34px;height:34px;font-size:15px}
  #mini{width:96px;height:72px}
  #acts{transform:scale(.8);transform-origin:bottom right}
  #chatlog{left:calc(env(safe-area-inset-left,0px) + 30vw);width:36vw;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);font-size:11px}
  #chatlog p:nth-last-child(n+4){display:none}
  #joyhint{width:80px;height:80px}
  #raidbar{position:fixed;left:calc(env(safe-area-inset-left,0px) + 8px);top:calc(env(safe-area-inset-top,0px) + 118px);width:min(230px,52vw);background:rgba(40,8,12,.82);color:#fff;border:2px solid #ff5a3a;padding:6px 8px;font-size:12px;font-weight:800;display:flex;gap:6px;align-items:center;z-index:4}
#raidbar[hidden]{display:none}#raidbar span{flex:1;line-height:1.35}#raidbar .btn{padding:4px 8px;font-size:12px;box-shadow:none}
#mapname{top:calc(env(safe-area-inset-top,0px) + 46px);font-size:17px}
  #toast{top:calc(env(safe-area-inset-top,0px) + 50px)}
  #toast p{font-size:12px;padding:4px 10px}
  .sheet{max-width:640px}
  #dialog{max-width:640px}
}
@media (prefers-reduced-motion:reduce){#toast p{animation-duration:3.2s;animation-timing-function:steps(1)}}
</style>
</head>
<body>
<canvas id="game" aria-label="게임 화면"></canvas>
<div id="hud" class="T" hidden></div>
<div id="top" class="T" hidden>
  <button class="ib" data-ui="players" aria-label="접속자">👥<span class="cnt" id="pc">1</span></button>
  <button class="ib" data-ui="chat" aria-label="채팅">💬</button>
  <button class="ib" data-ui="tree" aria-label="스킬 트리">🌳<span class="cnt" id="spc" hidden>0</span></button>

  <button class="ib" data-ui="bag" aria-label="가방">🎒</button>
  <button class="ib" data-ui="world" aria-label="세계 지도">🗺️</button>
  <button class="ib" data-ui="rank" aria-label="랭킹">🏆</button>
  <button class="ib" data-ui="menu" aria-label="설정">⚙️</button>

  <button class="ib" data-ui="full" id="fullbtn" aria-label="전체 화면">⛶</button>
</div>
<canvas id="mini" hidden aria-label="미니맵 (누르면 세계 지도)"></canvas>
<div id="raidbar" hidden><span id="raidtxt"></span><button class="btn" id="raidquit">포기</button></div>
<div id="mapname"></div>
<div id="chatlog"></div>
<div id="joyhint" class="B" hidden>드래그해서<br>이동</div>
<div id="joy"><i></i></div>
<div id="acts" class="B" hidden></div>
<div id="toast"></div>
<div id="prog"><span id="progt"></span><i></i></div>
<div id="dialog"></div>
<div id="chatbar"><input type="text" id="chatin" maxlength="60" placeholder="메시지 입력 (Enter)" autocomplete="off"><button class="btn pri" id="chatsend">전송</button><button class="btn" id="chatx">닫기</button></div>
<div class="layer" id="layer"><div class="sheet" id="sheet"></div></div>

function hitMon(m,mult,o={}){
 if(!m||m.hp<=0)return 0;
 let atk=P.S.atk;if(P.job==='ber'){atk*=1+(1-P.hp/P.S.hp)*.6}
 const T=(TEC||buildTE());if(o.basic)mult*=BASIC_MUL;const crit=o.crit||(!o.minion&&Math.random()*100<P.S.crit);const cm=(P.job==='gam'?2.4:1.6)+.02*(T.cdmg||0)+.008*(T.t_crit||0);
 let bonus=(m.vulnT>now()?1.5:1)*(1+(m.boss?.015*(T.boss||0)+.005*(T.m_boss||0):0)+(m.hp>=m.max?.02*(T.first||0):0)+(m.hp<m.max*.3?.02*(T.exec||0):0)+(o.proj?.015*(T.proj||0):0));
 let d=atk*mult*bonus*R(.9,1.1)*(crit?cm:1)-m.def*.5*(1-Math.min(.6,.015*(T.pen||0)));d=Math.max(1,Math.round(d));
 m.hp-=d;m.flash=.12;m.aggro=8;sfx(crit?'crit':'hit');if(m.mid&&W.raid)W.raid.my[m.mid]=(W.raid.my[m.mid]||0)+d;
 ftxt(m.x,m.y-16*m.sc-2,d,crit?'#ffd23a':'#ffffff',crit);
 if(o.burn||o.poison)m.dot={dps:P.S.atk*.12*(1+.08*(T.dot||0)),t:3,col:o.poison?'#9be15d':'#ff8a3a'};
 if(o.freeze&&Math.random()<o.freeze){m.slow=2.5;ftxt(m.x,m.y-24,'❄','#9fd8ff')}
 if(o.slow)m.slow=3;
 if(o.stun&&!m.boss)m.stun=Math.max(m.stun,(o.stun===true?1:o.stun)*(1+.06*(T.stun||0)));
 if(o.root&&!m.boss)m.stun=Math.max(m.stun,1.4);
 const drain=o.minion?0:Math.min(.2,.002*(T.drain||0)+.0005*(T.m_life||0)+(o.drain||0)+(['wen','vam','cnt'].includes(P.job)?.06:0)+P.buffs.reduce((a,b)=>a+(b.drain||0),0));if(drain)heal(Math.min(Math.round(d*drain),P.S.hp*.025),true);
 if(o.gold||o.steal||(o.basic&&(['bur','pkp'].includes(P.job)||P.buffs.some(b=>b.gold))&&Math.random()<.3)){const g=RI(1,3)*Math.ceil(m.lv/2);P.gold+=g;ftxt(m.x,m.y-28,'+'+g+'G','#ffd84a')}
 if(m.hp<=0)killMon(m,true);
 return d;
}

 P.gold+=gold;P.st.kills++;sfx(m.boss?'bossKill':'kill');ftxt(m.x,m.y-34,'+'+exp+' EXP','#9be15d');

 if(m.boss){P.st.bosses++;toast(`👑 ${eul(m.name)} 쓰러뜨렸다! +${gold}G`);sysChat(`${P.nick}님이 ${eul(m.name)} 처치했습니다!`);if(m.k==='dragon')P.st.dragon++}

function hurt(dmg,src,pen=0){

 const raw=dmg*R(.9,1.1);const ed=P.S.def*(1-pen);let d=raw*(1-ed/(ed+raw*2));if(P.job==='shd')d*=.8;d=Math.max(1,Math.round(d));
 if(P.buffs.some(b=>b.eter))d*=.5;
 d=Math.max(1,Math.round(d*(1-Math.min(.5,.01*(TV('block')||0)))*(src?1:1-Math.min(.5,.01*TV('resist')))));
 if(src&&src.hp>0&&TV('thorns')){const rf=Math.max(1,Math.round(d*Math.min(1,.03*TV('thorns'))));src.hp-=rf;ftxt(src.x,src.y-16*src.sc,rf,'#c8c0a0');if(src.hp<=0)killMon(src,true)}
 if(P.shield&&P.shield.until>now()&&P.shield.v>0){const ab=Math.min(P.shield.v,d);P.shield.v-=ab;d-=ab;ftxt(P.x,P.y-28,'🛡'+ab,'#9fd8ff');if(d<=0)return}

 if(P.task)cancelTask();
 if(P.hp<=0){if((TV('und')||0)&&(!P.undT||now()-P.undT>60)){P.undT=now();P.hp=1;toast('🛡️ 불굴! 쓰러지지 않았다');return}die()}

function nearInteract(){
 if(!MAP||!P)return null;let best=null,bd=24;
 for(const n of MAP.npcs){if(n.godOnly&&!godSees())continue;if(n.finOnly&&!finSees(n))continue;const d=D(P,n);if(d<bd){bd=d;best={type:'npc',ref:n,icon:'💬'}}}
 for(const o of MAP.objs){if(o.deco)continue;if(o.gogOnly){if(!gogSees())continue}else if(o.godOnly&&(o.kind!=='secretTp'||!godSees()))continue;const d=D(P,o);if(d<bd){bd=d;best={type:'obj',ref:o,icon:o.kind==='skyaltar'?'☁️':o.kind==='warp'?'🌀':o.kind==='prtablet'?'📜':o.kind==='prsword'?'🗡️':o.kind==='pritemple'?'⛩️':o.kind==='toilet'?'🚽':o.kind==='secretTp'?'✨':o.kind==='tele'?'🌀':o.kind==='altar'?'🙏':'📜'}}}
 for(const o of MAP.ores){if(o.dead>now())continue;const d=D(P,o);if(d<bd){bd=d;best={type:'ore',ref:o,icon:'⛏️'}}}
 if(!best){for(const[a,b]of[[0,14],[0,-16],[14,-4],[-14,-4]]){if(getT(MAP,Math.floor((P.x+a)/TS),Math.floor((P.y+b)/TS))===2)return {type:'fish',icon:'🎣'}}}
 return best;
}
function interact(){
 if(P.dead)return;if(P.task){cancelTask();return}
 const it=nearInteract();if(!it)return;
 if(it.type==='npc')talk(it.ref);
 else if(it.type==='obj')useObj(it.ref);
 else if(it.type==='ore'){const o=ORES[it.ref.type];if(P.pick<o.t){toast(`${o.n} 광석은 ${PICKS[o.t]} 이상이 필요합니다`);return}
  const sp=(1+.08*(TV('mine')||0))*(1+.15*P.pick)*({min:1.6,vmn:2.2,msn:1.3}[P.job]||1);
  P.task={type:'mine',ref:it.ref,t:0,need:(1.4+o.t*.5)/sp,label:`${o.n} 채광 중`,x:P.x,y:P.y}}
 else if(it.type==='fish'){P.task={type:'fish',t:0,need:(P.job==='fis'?1.2:R(2.4,3.6))/(1+.05*TV('fish')),label:'낚시 중…',x:P.x,y:P.y}}

function reqProg(r){switch(r[0]){case 'gogm1':return [P.gog&&P.gog.m1?1:0,1,'석상에 선함이 깃든 보석 봉인'];case 'gogm3':return [P.gog&&P.gog.m3?1:0,1,'신 중의 신 처치'];case 'raid':{const d=RAIDS.find(x=>x.id===r[1]);return [(P.raids&&P.raids[r[1]])||0,r[2],`${d?d.short:''} 레이드 클리어`]}case 'toilet':return [P.toilet||0,r[1],'마을 화장실 사용'];case 'pray':return [P.pray||0,r[1],'성당 제단에서 기도'];case 'kill':return [P.kc[r[1]]||0,r[2],`${MD[r[1]][0]} 처치`];case 'lv':return [P.lv,r[1],'레벨'];case 'ore':return [P.st.ores,r[1],'광석 채광'];case 'kills':return [P.st.kills,r[1],'몬스터 처치'];case 'uses':return [P.st.uses,r[1],'스킬 사용']}return [0,1,'?']}
function reqsOk(id){return (HM[id]||[]).every(r=>{const p=reqProg(r);return p[0]>=p[1]})}
function reqHtml(id){return (HM[id]||[]).map(r=>{const[a,b,t]=reqProg(r);return `<div>${a>=b?'✅':'⬜'} ${t} <b>${Math.min(a,b)}/${b}</b></div>`}).join('')}
function parentsOf(id){return Object.keys(JD).filter(k=>JD[k][4].includes(id))}
function where(id){const t=TRAINERS[id];return t?`${MAPS[t[0]].name} · ${t[3]}`:'?'}
const isHidBase=id=>JD[id][7]&&JD[id][3]===1;
/* 0: 불가, 1: 길은 맞지만 조건 부족, 2: 지금 전직 가능 */
const JOB_LV={spi:50,ang:150,dem:150,arA:300,fal:300,dkl:300,atn:300,god:600,gog:900};
for(const[id]of FINALS)JOB_LV[id]=800;
function reqLv(id){return JOB_LV[id]||TIER_LV[JD[id][3]]}
function trainState(id){
 if(!P||P.job===id)return 0;const j=JOB(id),cur=J();
 if(isHidBase(id)){if(P.job!=='none'&&cur.tier>1)return 0;return P.lv>=reqLv(id)&&reqsOk(id)?2:1}
 if(j.tier===1){if(P.job!=='none')return 0;return P.lv>=reqLv(id)?2:1}
 if(!parentsOf(id).includes(P.job))return 0;
 return P.lv>=reqLv(id)&&reqsOk(id)?2:1;
}

  else say=`<b>${j.name}</b>의 길에 관심이 있나?${info}${P.lv<reqLv(id)?`<div>⬜ 레벨 <b>${P.lv}/${reqLv(id)}</b> · 마을 이장의 미션으로 먼저 실력을 쌓고 오게.</div>`:'<div>✅ 자격이 충분하네!</div>'}`;

 }
 const opts=st===2?[{t:`⭐ ${j.name}(으)로 전직`,pri:1,f:()=>{if(isHidBase(id)&&P.job!=='none')ask(`${cur.name}의 길을 버리고 ${j.name}(으)로 전직할까요? 지금 직업의 스킬은 사라집니다.`,()=>promote(id));else promote(id)}}]:[];

function sceneFor(id){const m=MAPS[id];if(!m)return null;let x=MAPSTORY[id];if(!x&&id.startsWith('p_')){const base=m.name.replace(/^태초의 /,'').replace(/ \(.*\)$/,'');const b=m.boss&&MD[m.boss.k]?MD[m.boss.k][0]:'주인';x=`${base}… 아니, 처음 빚어진 날의 ${base}이다.\n지나온 세계와 똑같지만 색도 소리도 처음처럼 선명하다. 이곳의 ${b}은(는) 모든 우주에 존재하는 ${b}의 원형이다.`}
 if(!x)return null;const th=m.theme||'field';return {id:'m:'+id,t:m.name.replace(/ \(.*\)$/,''),sub:UNI_NAMES[m.uni]||'',x,scene:{style:SCN_OVR[id]||(SCN[th]?th:'field'),seed:[...id].reduce((a,ch)=>a*31+ch.charCodeAt(0)|0,7),mons:(m.spawns||[]).map(s_=>s_.k).filter((k,i,a)=>a.indexOf(k)===i).slice(0,2),boss:m.boss&&m.boss.k,uni:m.uni,player:true}}}
const STORY_FIXED={
 c0:{id:'c0',t:'프롤로그 — 별을 잇는 자',sub:'',x:'아주 먼 옛날, 이름 없는 신이 한 자루의 칼로 어둠을 갈라 세계를 빚었다. 사람들은 그것을 "태초의 칼"이라 불렀다.\n신들이 서로에게 칼끝을 겨눈 날, 칼은 빛 속으로 사라졌고 세계는 깨진 거울처럼 여러 우주로 갈라졌다.\n그리고 지금, 에르덴 성읍. 광장 분수 곁에서 눈을 뜬 당신의 손등에, 처음 보는 빛의 문장이 희미하게 빛나고 있다.',scene:{style:'village',seed:11,mons:[],player:true,uni:1}},

};

 const pend=[];if(!P.story.c0)pend.push(STORY_FIXED.c0);if(MAP&&!MAP.safe&&!MAP.raid&&!MAP.hall&&!P.story['m:'+MAP.id]){const sc=sceneFor(MAP.id);if(sc)pend.push(sc)}

 ov.style.cssText='position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px;opacity:0;transition:opacity .6s;font-family:inherit';

 const cv=ov.querySelector('canvas');try{drawScene(cv,c.scene||{})}catch(e){}

 const tx=ov.querySelector('#sctext');let i=0,done=false;const full=c.x;const tm=setInterval(()=>{i+=1;tx.textContent=full.slice(0,i);if(i>=full.length){done=true;clearInterval(tm)}},28);
 const close=(skip)=>{clearInterval(tm);document.removeEventListener('keydown',kd,true);ov.style.opacity='0';setTimeout(()=>{ov.remove();SCENE_ON=false;P.inv=now()+1.5;if(isNew&&!skip)setTimeout(storyCheck,500)},500)};
 const next=()=>{if(!done){done=true;clearInterval(tm);tx.textContent=full}else close(false)};

 ov.querySelector('#scnext').onclick=next;ov.querySelector('#scskip').onclick=()=>close(true)}

 openLayer(`${head('📥 캐릭터 가져오기')}<p class="muted">다른 버전에서 <b>📤 내보내기</b>로 받은 코드를 붙여 넣고, 저장할 칸을 고르세요. <b>고른 칸의 기존 캐릭터는 덮어써집니다.</b></p><textarea id="imcode" style="width:100%;height:130px;font:11px monospace;background:var(--surface2);color:var(--ink);border:2px solid var(--line);padding:6px" placeholder="PQ1:..."></textarea>
 <div class="row"><div class="f"><b>저장할 칸</b></div><select id="imslot" style="font:inherit;padding:6px;border:2px solid var(--line);background:var(--surface2);color:var(--ink)">${[...Array(MAXSLOT).keys()].map(i=>`<option value="${i}">${i+1}번 칸${SLOTS[i]?` · ${esc(SLOTS[i].nick||'')} Lv ${SLOTS[i].lv||1}`:' · 비어 있음'}</option>`).join('')}</select></div>
 <button class="btn pri w" id="imgo">가져오기</button>`,

function newQuest(){
 if(!P.qn)return {type:'kill',k:'slime',n:5,c:0,map:'field'};
 const r=Math.random();
 if(r<.12&&P.lv>=5){const ok=ORE_ORDER.filter(k=>ORES[k].t<=P.pick);const k=ok[Math.min(ok.length-1,RI(Math.max(0,ok.length-3),ok.length-1))];return {type:'ore',k,n:RI(5,10),c:0,map:'mine'}}
 if(r<.22)return {type:'fish',n:RI(3,5),c:0,map:'village'};
 const cand=[];for(const id in MAPS){const m=MAPS[id];if(m.minLv>P.lv||(m.uni||1)!==1||m.raid||m.hall)continue;for(const s of m.spawns)if(s.lv[0]<=P.lv+2&&s.lv[1]>=P.lv-6)cand.push({k:s.k,map:id})}
 if(!cand.length)for(const id in MAPS){const m=MAPS[id];if(m.minLv<=P.lv)for(const s of m.spawns)cand.push({k:s.k,map:id})}
 const c=pick(cand);return {type:'kill',k:c.k,n:RI(8,15),c:0,map:c.map};
}
function questText(q){return q.type==='kill'?`${MD[q.k][0]} ${q.n}마리 처치 (${MAPS[q.map].name})`:q.type==='ore'?`${ORES[q.k].n} 광석 ${q.n}개 채광 (깊은 광산)`:`물고기 ${q.n}마리 낚기 (마을 연못·항구)`}
function chiefTalk(n){
 n.flip=P.x<n.x;const q=P.quest;
 if(q&&q.c>=q.n){
  const exp=Math.round(need(P.lv)*.35),gold=50+P.lv*25;
  dialog(n.name,`오오, 해냈구먼! 마을이 한결 평화로워졌네.<br>보상: <b>경험치 ${exp.toLocaleString()}</b>, <b>${gold.toLocaleString()}G</b>, 🧪 물약 2개`,[{t:'🎁 보상 받기',pri:1,f:()=>{P.quest=null;P.qn=(P.qn||0)+1;P.gold+=gold;P.items.potion+=2;toast(`🎁 +${gold}G, 물약 2개`);gainExp(exp);save(true);setTimeout(()=>chiefTalk(n),300)}}]);
 } else if(q){
  dialog(n.name,`아직 일이 남았네.<br>📜 <b>${questText(q)}</b> — ${q.c}/${q.n}`,[{t:'다른 미션으로 바꾸기',f:()=>{P.quest=newQuest();toast('📜 새 미션을 받았습니다');save(false)}}]);
 } else {
  const nq=newQuest();
  const intro=!P.qn?`어서 오게, 젊은이! 나는 이 마을 이장이네. 요즘 마을 동쪽 <b>푸른 초원</b>에 슬라임이 너무 많아졌어. 좀 도와주겠나?<br><span class="muted">미션은 끝낼 때마다 새로 받을 수 있어요. 레벨이 오르면 더 먼 곳의 미션을 줍니다.</span>`:`마침 잘 왔네. 이번 부탁은 이걸세.`;
  dialog(n.name,`${intro}<br>📜 <b>${questText(nq)}</b>`,[{t:'📜 미션 수락',pri:1,f:()=>{P.quest=nq;toast('📜 미션을 받았습니다');save(false)}}]);
 }
}

 const have=[['g1','🟤 대지의 보석','용의 둥지 · 레드 드래곤'],['g2','🔵 파도의 보석','해적 요새 · 심해의 크라켄'],['g3','🔴 불꽃의 보석','불사조 둥지 · 불사조']];const ok=have.every(([k])=>rl[k]>0);

function dimPriest(n){P.frames=P.frames||{};const rl=P.relic=P.relic||{};P.mqDone=P.mqDone||{};
 if(P.frames[3]){dialog(n.name,'세 번째 우주로 가는 문은 이미 그대에게 열려 있네. 🎒 가방이나 🗺️ 지도의 "차원 이동"을 쓰게.',[]);return}

 else if(!s.m2)say='두 번째 시련: <b>시간이 멈춘 곳에 남겨진 글을 읽어라.</b>';

 dialog(n.name,say,[])}

  canyon:[['scorpion',46,56]],castle:[['watcher',62,75]],volcano:[['magmaScorp',72,82]],lair:[['magmaScorp',86,95]],sky:[['crab',105,160]],abyss:[['voidEye',260,370]],chaos:[['voidEye',520,660]],divine:[['watcher',760,950]],
  i2_a:[['crab',100,140]],i2_b:[['treant',165,215]],i2_c:[['watcher',235,290]],i3_a:[['lavaCrab',305,360]],i3_b:[['spider',410,480]],i3_c:[['magmaScorp',510,590]],sk_a:[['watcher',610,700]],sk_b:[['voidEye',760,880]],sk_c:[['voidEye',910,990]],

 for(const id in EX){const m=MAPS[id];if(!m||!m.spawns)continue;for(const[k,a,b]of EX[id])m.spawns.push({k,a:[3,3,m.w-4,m.h-4],n:5,lv:[a,b]})}
}
function specialDropsOf(m,k,boss){const out=[];
 if(boss&&k==='dragon'&&m.id==='lair')out.push('🟤 대지의 보석 30%');if(k==='kraken')out.push('🔵 파도의 보석 30%');if(k==='phoenix')out.push('🔴 불꽃의 보석 30%');
 if(k==='skyEmperor')out.push('🌌 차원 틀 (두 번째 우주) 10%');if(boss&&m.uni===2)out.push('💠 차원 파편 35%');
 if(m.id==='p_divine'){if(boss&&k==='fallenGod')out.push('💎 선함이 깃든 보석 1% (신 전용)');if(!boss)out.push('🗝️ 던전 열쇠 1% (신 전용)')}
 return out}
let DEXMAP=null;
function openDex(id){
 const m=MAPS[id||DEXMAP||MAP.id]||MAP;DEXMAP=m.id;const u=m.uni||uniOf();const list=uniMaps(u).filter(x=>!x.safe&&x.spawns&&x.spawns.length);
 const kinds=[];for(const s_ of (m.spawns||[])){const e=kinds.find(x=>x.k===s_.k);if(e){e.lo=Math.min(e.lo,s_.lv[0]);e.hi=Math.max(e.hi,s_.lv[1])}else kinds.push({k:s_.k,lo:s_.lv[0],hi:s_.lv[1]})}
 const maxLv=Math.max(0,...kinds.map(x=>x.hi),m.boss?m.boss.lv:0);
 const rarNote=`일반 몬스터: 무기 ${Math.round(11)}% · 갑옷 9% · 전리품 45%${maxLv>=2000?` · 🩵 초월 등급 가능`:''}${maxLv>=3000?` · 🤍 태초 등급 가능`:''}`;
 const icon=k=>`<canvas width="16" height="16" data-mon="${k}" style="width:36px;height:36px;image-rendering:pixelated;flex:none"></canvas>`;
 const wname=k=>MON_W[k]&&WTYPE[MON_W[k]]?WTYPE[MON_W[k]].n:'무작위';
 const monRows=kinds.map(x=>{const sp=specialDropsOf(m,x.k,false);return `<div class="row">${icon(x.k)}<div class="f"><b>${MD[x.k][0]} <span class="muted">Lv ${x.lo}~${x.hi}</span></b><span class="muted">📦 ${LOOT[x.k]||'-'} · ⚔️ 잘 떨구는 무기: ${wname(x.k)}${sp.length?' · '+sp.join(' · '):''}</span></div></div>`}).join('');
 let bossRow='';if(m.boss){const b=m.boss,sk=(BOSS_SK[b.k]||[]).map(x=>x[0]);const sp=specialDropsOf(m,b.k,true);
  bossRow=`<h3>👑 보스</h3><div class="row">${icon(b.k)}<div class="f"><b>${MD[b.k][0]} <span class="muted">Lv ${b.lv} · 40초마다 재등장</span></b><span class="muted">스킬: ${sk.join(', ')||'내려찍기'}<br>드롭: 장비 확정 (희귀~전설${b.lv>=2000?' · 초월':''}${b.lv>=3000?' · 태초':''}) · 📦 ${LOOT[b.k]||'-'} ×3 · ⚔️ ${wname(b.k)}${sp.length?'<br>✨ '+sp.join(' · '):''}</span></div></div>`}
 const ores=m.ores&&m.ores.length?`<h3>⛏️ 광석</h3><p class="muted">${[...new Set(m.ores.map(o=>o.type))].map(t=>`<span style="color:${ORES[t].c}">◆</span> ${ORES[t].n}`).join(' · ')}</p>`:'';
 openLayer(`${head('📖 지역 도감')}<div class="row"><div class="f"><b>${esc(m.name)}</b><span class="muted">${UNI_NAMES[u]||''} · 입장 Lv ${m.minLv||1}</span></div><select id="dexsel" style="font:inherit;padding:6px;max-width:55%;border:2px solid var(--line);background:var(--surface2);color:var(--ink)">${list.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
 <h3>🐾 몬스터 (${kinds.length}종)</h3>${monRows||'<p class="muted">몬스터가 없는 안전 지역입니다.</p>'}${bossRow}${ores}<p class="muted" style="margin-top:8px">${rarNote}</p>`,
 root=>{root.querySelector('#dexsel').onchange=e=>openDex(e.target.value);paintMinis(root)});
}

 FONT=getComputedStyle(document.body).fontFamily;
